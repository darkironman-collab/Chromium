name: Build Extreme Privacy Chromium

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'overlay/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      chromium_ref:
        description: 'Chromium ref/tag/commit (default: main)'
        required: false
        default: 'main'
      runner_labels:
        description: 'JSON array of x64 Linux runner labels'
        required: false
        default: '["self-hosted","linux","x64","chromium"]'
      full_build:
        description: 'Run full Chromium Android build'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts
        run: |
          python3 -m py_compile scripts/apply_privacy_patches.py
          bash -n scripts/fetch_chromium.sh
          bash -n scripts/build_android.sh
          bash -n scripts/validate_upstream.sh
          bash -n scripts/prepare_x64_builder.sh
          bash -n scripts/register_github_runner.sh
      - name: Verify required files
        run: |
          test -s overlay/chrome/android/java/src/org/chromium/chrome/browser/privacy/ExtremeVpnGuard.java
          test -s scripts/apply_privacy_patches.py
          test -s scripts/prepare_x64_builder.sh
          test -s scripts/register_github_runner.sh

  validate-upstream:
    runs-on: ubuntu-latest
    needs: validate-overlay
    env:
      CHROMIUM_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.chromium_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
      - name: Sparse-checkout Chromium and apply privacy patches
        run: bash ./scripts/validate_upstream.sh

  build-android:
    if: github.event_name == 'workflow_dispatch' && inputs.full_build
    needs: [validate-overlay, validate-upstream]
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 720
    env:
      CHROMIUM_REF: ${{ inputs.chromium_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare and verify x64 builder
        run: MIN_DISK_GB=150 MIN_RAM_GB=16 bash ./scripts/prepare_x64_builder.sh

      - name: Fetch Chromium
        run: bash ./scripts/fetch_chromium.sh

      - name: Apply Extreme Privacy patches
        run: python3 ./scripts/apply_privacy_patches.py ./work/chromium/src

      - name: Show privacy diff
        working-directory: work/chromium/src
        run: git diff --stat && git diff --check

      - name: Build ARM64 browser APK
        run: bash ./scripts/build_android.sh ./work/chromium/src

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExtremePrivacyBrowser-arm64
          path: |
            dist/ExtremePrivacyBrowser-arm64.apk
            dist/ExtremePrivacyBrowser-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14
